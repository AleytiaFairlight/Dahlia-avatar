name: Dahlia Release

# Builds the Dahlia Avatar apps for Windows and Android when a version tag reaches
# AleytiaFairlight/Dahlia-avatar, and attaches them to a draft GitHub release. DahliaBot pushes the
# branch and the tag with scripts/publish_avatar_branch.sh --tag. Publish the draft to release it:
# the desktop updater only sees published releases.
#
# The tag must match the app versions, for example v0.12.2-beta.9: the desktop
# (apps/stage-tamagotchi/package.json) and Android (app-version.properties) versions,
# plus the Kirie trio (apps/stage-tamagotchi-kirie/package.json and project.godot
# config/version; scripts/avatar_app_version.py keeps them synced).
#
# A Kirie-only alpha tag (for example v0.1.0-alpha.1) matches just the Kirie
# versions and builds only the Kirie job: the desktop and Android apps stay on
# their beta line. The draft is still marked as a prerelease.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: dahlia-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # The Android job installs on Linux, where onnxruntime-node's install script would download ONNX Runtime's CUDA build
  # from github.com/microsoft/onnxruntime, which Microsoft made private on 2026-11-17 (404). The apps don't use it.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      kirie_only: ${{ steps.version.outputs.kirie_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Compare the tag with the app versions
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          desktop="$(jq -r .version apps/stage-tamagotchi/package.json)"
          android="$(sed -n 's/^AIRI_VERSION_NAME=//p' apps/stage-pocket/android/app-version.properties)"
          kirie="$(jq -r .version apps/stage-tamagotchi-kirie/package.json)"
          godot="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' apps/stage-tamagotchi-kirie/project.godot)"
          if [[ "$tag" == "$kirie" && "$tag" == "$godot" && "$tag" != "$desktop" ]]; then
            echo "kirie_only=true" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" != "$desktop" || "$tag" != "$android" || "$tag" != "$kirie" || "$tag" != "$godot" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the desktop ($desktop), Android ($android), Kirie ($kirie) and Godot ($godot) app versions"
            exit 1
          else
            echo "kirie_only=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows desktop
    needs: version
    # success() keeps a failed version check (empty outputs) from running the build.
    if: ${{ success() && needs.version.outputs.kirie_only != 'true' }}
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VITE_ENABLE_ANALYTICS: 'false'
      SHERPAW_BUNDLE_MODELS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26.12.1
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages

      # Dahlia's English speech model isn't on Sherpaw's hub; its pack is built from sherpa-onnx's release.
      - name: Build the English speech model pack
        run: node scripts/dahlia-sherpaw-pack.mjs

      # Voice detection's ONNX Runtime and Silero VAD model, which the apps can't download.
      - name: Add the voice detection files
        run: node scripts/dahlia-vad-assets.mjs

      - name: Build the installer
        run: pnpm run -F @proj-airi/stage-tamagotchi build && pnpm -F @proj-airi/stage-tamagotchi exec electron-builder build --windows --x64 --publish never

      # The updater reads latest-x64.yml from the release to find the installer.
      - name: Write the update manifest
        shell: bash
        run: |
          installer="apps/stage-tamagotchi/dist/Dahlia-$VERSION-windows-x64-setup.exe"
          test -f "$installer"
          pnpm -F @proj-airi/stage-tamagotchi run regenerate-windows-latest --input "$installer" --output apps/stage-tamagotchi/dist/latest-x64.yml --version "$VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            apps/stage-tamagotchi/dist/Dahlia-*-windows-x64-setup.exe
            apps/stage-tamagotchi/dist/latest-x64.yml
          if-no-files-found: error
          # Only the release job reads it; the release keeps the files.
          retention-days: 1

  android:
    name: Android
    needs: version
    # success() keeps a failed version check (empty outputs) from running the build.
    if: ${{ success() && needs.version.outputs.kirie_only != 'true' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VITE_ENABLE_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      # The action's default packages include "tools", which the current SDK no longer has.
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26.12.1
          cache: true
          install: false

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;36.1.0"
          echo "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.1.0" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages

      - name: Build the English speech model pack
        run: node scripts/dahlia-sherpaw-pack.mjs

      # Voice detection's ONNX Runtime and Silero VAD model, which the apps can't download.
      - name: Add the voice detection files
        run: node scripts/dahlia-vad-assets.mjs

      - name: Build the web assets
        run: pnpm -F @proj-airi/stage-pocket run build

      - name: Capacitor sync
        run: pnpm -F @proj-airi/stage-pocket exec cap sync android

      # Listening in the background: the sherpa-onnx Android library and the wake word model.
      - name: Fetch the wake word library and model
        run: bash apps/stage-pocket/scripts/fetch-dahlia-kws.sh

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CAPACITOR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::The CAPACITOR_ANDROID_KEYSTORE_* secrets are missing. See avatar/DAHLIA.md in DahliaBot."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dahlia-pocket.p12"

      - name: Build the APK
        working-directory: apps/stage-pocket/android
        run: pnpm -F @proj-airi/stage-pocket exec cap build android
        env:
          CAPACITOR_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dahlia-pocket.p12
          CAPACITOR_ANDROID_KEYSTORE_ALIAS: ${{ secrets.CAPACITOR_ANDROID_KEYSTORE_ALIAS }}
          CAPACITOR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CAPACITOR_ANDROID_KEYSTORE_PASSWORD }}
          CAPACITOR_ANDROID_KEYSTORE_ALIAS_PASSWORD: ${{ secrets.CAPACITOR_ANDROID_KEYSTORE_ALIAS_PASSWORD }}

      - name: Name the APK
        run: |
          mkdir -p dahlia-release
          mv apps/stage-pocket/android/app/build/outputs/apk/release/app-release-signed.apk "dahlia-release/Dahlia-$VERSION-android.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: dahlia-release/*.apk
          if-no-files-found: error
          # Only the release job reads it; the release keeps the files.
          retention-days: 1

  kirie:
    name: Kirie Windows
    needs: version
    # No if: gate — the Kirie host builds for both the beta trio and Kirie-only alpha tags.
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VITE_ENABLE_ANALYTICS: 'false'
      SHERPAW_BUNDLE_MODELS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Godot 4.7.2-stable_mono plus the export templates (Windows included).
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26.12.1
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages

      # Dahlia's English speech model isn't on Sherpaw's hub; its pack is built from sherpa-onnx's release.
      - name: Build the English speech model pack
        run: node scripts/dahlia-sherpaw-pack.mjs

      # Voice detection's ONNX Runtime and Silero VAD model, which the apps can't download.
      - name: Add the voice detection files
        run: node scripts/dahlia-vad-assets.mjs

      # KirieClient and the Godot addons are git-ignored; install them before building.
      # kirie doctor shells out to bare `dotnet msbuild -getProperty`, which
      # refuses solution files (MSB1063) — hide ours while it inspects the
      # project, then restore it for the build and the export (which requires
      # StageTamagotchiKirie.sln to ship managed code in the .pck).
      - name: Install the Kirie addons
        shell: pwsh
        run: |
          $sln = "apps/stage-tamagotchi-kirie/StageTamagotchiKirie.sln"
          $hidden = "$env:RUNNER_TEMP/StageTamagotchiKirie.sln"
          Move-Item $sln $hidden
          try {
            pnpm -F @proj-airi/stage-tamagotchi-kirie exec kirie doctor --fix plugin:core
            pnpm -F @proj-airi/stage-tamagotchi-kirie exec kirie doctor --fix plugin:notifications
            pnpm -F @proj-airi/stage-tamagotchi-kirie exec kirie doctor --fix plugin:tray
          } finally {
            Move-Item $hidden $sln
          }

      # kirie build runs the Web build and bare `dotnet build`; the csproj already pins Platform to x64.
      - name: Build the Kirie app
        run: pnpm -F @proj-airi/stage-tamagotchi-kirie run build

      - name: Export the Windows build
        working-directory: apps/stage-tamagotchi-kirie
        shell: bash
        run: |
          godot --version
          godot --headless --import
          mkdir -p dist/Dahlia-Kirie-windows-x64
          godot --headless --export-release "Dahlia Kirie Windows x64" dist/Dahlia-Kirie-windows-x64/dahlia.exe
          ls dist/Dahlia-Kirie-windows-x64

      # libcef and the native hosts need the VC++ runtime; bundle it app-local
      # (System32 on the x64 runner holds the 64-bit DLLs) so test machines
      # without the redist don't die in the loader before any log is written.
      - name: Bundle the VC++ runtime
        shell: pwsh
        run: |
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            Copy-Item "$env:SystemRoot\System32\$dll" "apps/stage-tamagotchi-kirie/dist/Dahlia-Kirie-windows-x64\$dll"
          }
          Get-ChildItem apps/stage-tamagotchi-kirie/dist/Dahlia-Kirie-windows-x64/*.dll | Select-Object Name

      # Headless smoke run: proves the export boots into managed code on a clean
      # machine. Never fails the job (alpha diagnostics): the exit code and the
      # host log tail tell whether the crash is GPU/driver-specific or not.
      - name: Smoke-test the export
        shell: pwsh
        continue-on-error: true
        run: |
          $dir = "apps/stage-tamagotchi-kirie/dist/Dahlia-Kirie-windows-x64"
          # Host-level .NET trace: shows hostfxr probing and runtime load order
          # on stderr (unbuffered), so a crash during C# init leaves a trail.
          $env:COREHOST_TRACE = "1"
          $env:DOTNET_HOST_PATH = ""
          $proc = Start-Process -FilePath "$dir/dahlia.exe" -ArgumentList "--headless", "--verbose", "--no-webview", "--quit-after", "120" -PassThru -RedirectStandardOutput "$dir/smoke-stdout.txt" -RedirectStandardError "$dir/smoke-stderr.txt"
          if (-not $proc.WaitForExit(180000)) { $proc.Kill(); "SMOKE: still running after 180s, killed" }
          "SMOKE: exit code $($proc.ExitCode)"
          "SMOKE: stdout tail:"
          Get-Content "$dir/smoke-stdout.txt" -ErrorAction SilentlyContinue | Select-Object -Last 40
          "SMOKE: stderr tail:"
          Get-Content "$dir/smoke-stderr.txt" -ErrorAction SilentlyContinue | Select-Object -Last 20
          Get-Content "$dir/logs/dahlia-host.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
          $godotLog = "$env:APPDATA/Godot/app_userdata/Dahlia/logs/godot.log"
          "SMOKE: godot.log tail:"
          Get-Content $godotLog -ErrorAction SilentlyContinue | Select-Object -Last 30

      # Window helper and files MCP server: the host runs them from its own
      # folder (dahlia-window-helper.cs, dahlia-files-service.cs), so ship them
      # loose next to the exe, not just inside the .pck.
      - name: Bundle the host scripts
        shell: pwsh
        run: |
          Copy-Item apps/stage-tamagotchi-kirie/resources/dahlia-window-helper.ps1 apps/stage-tamagotchi-kirie/dist/Dahlia-Kirie-windows-x64/
          Copy-Item apps/stage-tamagotchi-kirie/resources/dahlia-files-mcp.mjs apps/stage-tamagotchi-kirie/dist/Dahlia-Kirie-windows-x64/

      - name: Zip the Windows build
        shell: pwsh
        run: |
          mkdir dahlia-release -Force | Out-Null
          Compress-Archive -Path apps/stage-tamagotchi-kirie/dist/Dahlia-Kirie-windows-x64 -DestinationPath "dahlia-release/Dahlia-Kirie-$env:VERSION-windows-x64.zip"

      # The Kirie updater reads kirie-latest-x64.json from the release (server-first feed, GitHub fallback).
      - name: Write the update manifest
        shell: bash
        run: |
          test -f "dahlia-release/Dahlia-Kirie-$VERSION-windows-x64.zip"
          node -e 'const crypto = require("node:crypto"); const fs = require("node:fs"); const version = process.env.VERSION; const name = "Dahlia-Kirie-" + version + "-windows-x64.zip"; const data = fs.readFileSync("dahlia-release/" + name); const manifest = { version: version, releaseDate: new Date().toISOString(), files: [{ name: name, url: "https://github.com/" + process.env.GITHUB_REPOSITORY + "/releases/download/v" + version + "/" + name, sha512: crypto.createHash("sha512").update(data).digest("hex") }] }; fs.writeFileSync("dahlia-release/kirie-latest-x64.json", JSON.stringify(manifest, null, 2) + "\n");'
          cat dahlia-release/kirie-latest-x64.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kirie
          path: |
            dahlia-release/*.zip
            dahlia-release/*.json
          if-no-files-found: error
          # Only the release job reads it; the release keeps the files.
          retention-days: 1

  release:
    name: Draft release
    needs: [version, windows, android, kirie]
    # A Kirie-only alpha tag skips the Windows/Android jobs, and a skipped need
    # would otherwise skip this job too. needs: itself can't be conditional.
    if: ${{ !cancelled() && needs.kirie.result == 'success' && (needs.version.outputs.kirie_only == 'true' || (needs.windows.result == 'success' && needs.android.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dahlia-release
          merge-multiple: true

      - name: Create the draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ needs.version.outputs.kirie_only == 'true' && 'Kirie alpha 0.1' || format('Dahlia Avatar {0}', needs.version.outputs.version) }}
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: dahlia-release/*
          body: |
            ${{ needs.version.outputs.kirie_only == 'true' && 'Kirie alpha 0.1 is the first test build of Dahlia''s Godot desktop host (Project AIRI Kirie + Godot CEF), at feature parity with the Electron app. It reports to the Dahlia server.' || 'Dahlia Avatar is Dahlia''s companion app, built from [Project AIRI](https://github.com/moeru-ai/airi) (MIT license) with Dahlia''s name and settings.' }}

            ${{ needs.version.outputs.kirie_only == 'true' && format('- **Kirie (Windows)**: `Dahlia-Kirie-{0}-windows-x64.zip`, a portable zip with no installer yet: unzip it and run `dahlia.exe`. The build isn''t code-signed, so Windows SmartScreen may warn before it runs. `kirie-latest-x64.json` is the Kirie updater''s server-first feed. Needs 64-bit Windows; the UI runs in the Godot CEF WebView. Windows-only: screen recording needs Media Foundation and the VC++ redist. This is a test build: report what breaks before it ships on the beta line.', needs.version.outputs.version) || format('- **Windows**: `Dahlia-{0}-windows-x64-setup.exe`. The installer isn''t code-signed yet, so Windows SmartScreen may warn before it runs.\n- **Kirie (Windows)**: `Dahlia-Kirie-{0}-windows-x64.zip`. The zip isn''t code-signed either, so SmartScreen may warn before it runs. `kirie-latest-x64.json` is the Kirie updater''s server-first feed.\n- **Android**: `Dahlia-{0}-android.apk`. It installs as its own app, next to AIRI''s.\n\nThe Windows app checks this repository''s releases for updates.', needs.version.outputs.version) }}
