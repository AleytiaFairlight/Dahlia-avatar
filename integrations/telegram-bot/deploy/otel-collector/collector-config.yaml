extensions:
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector-metrics
          scrape_interval: 10s
          static_configs:
            - targets: ['127.0.0.1:8888']

  # OTLP over HTTP only: the bot sends to :4318 (OTLPTraceExporter / OTLPMetricExporter from -otlp-proto).
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true

  # Traces go on to Tempo over OTLP/HTTP, not gRPC.
  otlphttp:
    endpoint: http://tempo:4318

  debug:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheusremotewrite]
    traces:
      receivers: [otlp]
      exporters: [otlphttp]
    logs:
      receivers: [otlp]
      exporters: [debug]
