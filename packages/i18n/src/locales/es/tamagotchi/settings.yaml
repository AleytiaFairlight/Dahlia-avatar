allow-visible-on-all-workspaces:
  title: Visibilidad Entre Espacios
  description: Permitir que la ventana sea visible en todos los espacios de trabajo, solo macOS.
microphone-permission:
  prompt:
    title: '¿Permitir el acceso al micrófono?'
    description: Dahlia usa el micrófono para la entrada de voz y la transcripción. Esta decisión se mantiene hasta que la restablezcas en los ajustes.
    allow: Permitir
    deny: Denegar
  states:
    not-determined: Sin configurar
    granted: Permitido
    denied: Denegado
  settings:
    title: Micrófono
    description: Controla si Dahlia puede usar el micrófono. Restablecer esta decisión detiene el flujo actual del micrófono y vuelve a pedir permiso la próxima vez.
    revoke: Revocar acceso
    reset: Restablecer decisión
spotlight:
  errors:
    unknown: Error desconocido
    prefix: 'Algo salió mal: {message}'
    shortcutRegistrationFailed: 'Algo salió mal: no se pudo registrar el atajo de Spotlight.'
pages:
  modules:
    mcp-server:
      description: Conectar y gestionar servidor MCP y herramientas
      title: Servidor MCP
  system:
    general:
      hide-app-icon:
        title: Ocultar icono de la barra de tareas / Dock
        description: Mantén Dahlia solo en la bandeja del sistema. Usa su menú para abrir ventanas o salir. Los cambios se aplican inmediatamente.
        load-error: No se pudo cargar el ajuste del icono de la aplicación.
        save-error: No se pudo actualizar el ajuste del icono de la aplicación.
    sections:
      section:
        window-shortcuts:
          title: Atajos de Teclado
    window-shortcuts:
      description: Modificar los atajos de ventana.
      title: Atajos de Ventana
      empty: Sin configurar
      spotlight:
        title: Atajo de Spotlight
        description: Haz clic en el atajo y pulsa un nuevo atajo. Pulsa Esc para cancelar.
      push-to-talk:
        title: Atajo de pulsar para hablar
        description: Mantén pulsado este atajo en cualquier aplicación mientras hablas con Dahlia. Haz clic en el atajo y pulsa uno nuevo. Pulsa Esc para cancelar.
        inactive: Este atajo solo funciona cuando el modo de entrada de Audición es pulsar para hablar y el micrófono está encendido.
      actions:
        recording: Pulsa las teclas
        reset: Restablecer
      errors:
        load: No se pudo cargar el atajo
        conflict: El atajo ya está en uso.
        failed: No se pudo actualizar el atajo
        requiresModifier: 'Usa al menos una de estas teclas: Cmd, Ctrl, Alt o Super.'
        requiresHoldModifier: Usa Cmd, Ctrl, Alt o Super, o una tecla de función como F13. Shift por sí sola no basta.
        denied: Dahlia no puede leer las teclas globales. Permite Dahlia en los ajustes de accesibilidad y vuelve a intentarlo.
        unsupported: Este sistema no puede detectar cuándo sueltas un atajo global.
      toggle-move:
        label: Alternar Mover
      toggle-resize:
        label: Alternar Redimensionar
      toggle-ignore-mouse-event:
        label: Alternar Ignorar Evento del Ratón
      press-keys: Presionar Teclas...
    developer:
      sections:
        section:
          use-window-mouse:
            title: Herramienta useWindowMouse
            description: Evalúa la posición del cursor de la ventana de Electron
devtools:
  title: Desarrollador
  pages:
    context-flow:
      title: Flujo de contexto
    presence-bubble:
      title: Burbuja de presencia
      description: Controla la burbuja sobre el personaje y obsérvala en la ventana principal
      override:
        title: Controlar la burbuja desde aquí
        description: Si está desactivado, el escenario no muestra la burbuja salvo durante un turno de chat.
      thinking:
        title: Razonamiento
        description: Muestra los puntos. Tiene prioridad sobre el número de mensajes sin leer.
      unread:
        title: Mensajes sin leer
        description: Se muestra como un panel sobre la cabeza, con una marca y el número.
      main-window-note: Los cambios aparecen en la ventana principal de Dahlia.
    editor:
      title: Editor de Dahlia
      description: Abrir la ventana independiente del editor de Dahlia
      button: Abrir editor
    lag-visualizer:
      title: Visualizador de retraso
    performance-visualizer:
      title: Visualizador de rendimiento
      description: Cambiar FPS/tareas largas/superposición de memoria
      resource-events:
        title: Eventos de recursos recientes
        description: El evento recibido más reciente aparece primero. El tiempo son milisegundos desde el inicio del proceso de renderizado de origen.
        empty: No hay eventos de recursos registrados. Carga o cambia un modelo VRM con el seguimiento activado.
        columns:
          time: Tiempo (ms)
          phase: Fase
          reason: Motivo
          textures: Texturas
          geometries: Geometrías
          meshes: Mallas
          materials: Materiales
      controls:
        enable-all:
          label: Activar todas las métricas disponibles
          description: Activa cada métrica compatible con este navegador.
        start-recording: Iniciar grabación
        stop-recording: Detener grabación ({seconds}s)
        export-last-recording: Exportar la última grabación
      metrics:
        fps:
          description: Frecuencia de fotogramas de animación en los últimos 10 segundos. Cada muestra es 1000 dividido por el intervalo entre fotogramas en milisegundos.
        frame-duration:
          label: Tiempo de fotograma (ms)
          description: Tiempo entre fotogramas de animación en los últimos 10 segundos.
        long-task:
          label: Tareas largas
          description: Tareas del hilo principal que duran al menos 50 ms.
          unsupported: Este navegador no proporciona tiempos de tareas largas.
        memory:
          label: Heap de JS (MB)
          description: Uso del heap de JavaScript obtenido de la API performance.memory de Chromium.
          unsupported: Este navegador no proporciona el uso del heap de JavaScript.
      recording:
        title: Última grabación
        duration: Duración {duration} ms
        limit: La grabación se detiene a los 60 segundos.
      history:
        title: Historial de FPS
        latest: Último
        minimum: Mín.
        maximum: Máx.
        empty: No hay muestras de FPS. Activa FPS para recoger muestras.
      overlay:
        title: Rendimiento
        move: Mover indicador de rendimiento
        reset-position: Restablecer posición del indicador
        record: Grabar
        stop: Detener
        export: Exportar la última grabación
        average: prom.
    markdown-stress:
      title: Estrés por Markdown
      description: Análisis y renderizado de Markdown bajo estrés con cargas de chat pesadas
    io-tracer:
      title: Trazador de E/S
      recording:
        title: Registrar trazas de E/S automáticamente
        description: Guarda los intervalos de E/S terminados como JSON Lines en la carpeta de datos de la aplicación para que los agentes de programación los analicen. Se eliminan los archivos de más de siete días.
    widgets-calling:
      title: Llamada de Widget
screen-capture:
  permissions-prompt:
    title: Captura de pantalla
    description: Para capturar las pantallas o ventanas, se requieren permisos de grabación de pantalla y audio del sistema.
    open-preferences: Abrir Preferencias del Sistema
    dismiss: Descartar
    instructions:
      step-1: Abre "Preferencias del sistema", selecciona "Privacidad y Seguridad" en la barra lateral.
      step-2: En las secciones "Grabación de pantalla y del audio del sistema" y "Solo grabación del audio del sistema", encienda los interruptores para Dahlia.
      step-2-note: Si Dahlia no aparece en la lista, añádelo manualmente haciendo clic en el botón "+" y seleccionando Dahlia de la carpeta Aplicaciones.
