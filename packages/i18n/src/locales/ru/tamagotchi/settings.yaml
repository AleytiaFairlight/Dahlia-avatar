allow-visible-on-all-workspaces:
  title: Межпространственная видимость
  description: Позволяет окну быть видимым на всех рабочих столах, только для macOS.
microphone-permission:
  prompt:
    title: Разрешить доступ к микрофону?
    description: Dahlia использует микрофон для голосового ввода и распознавания речи. Этот выбор действует до сброса в настройках.
    allow: Разрешить
    deny: Запретить
  states:
    not-determined: Не задано
    granted: Разрешено
    denied: Запрещено
  settings:
    title: Микрофон
    description: Управляйте доступом Dahlia к микрофону. Сброс выбора останавливает текущий поток микрофона и запрашивает разрешение при следующем использовании.
    revoke: Отозвать доступ
    reset: Сбросить выбор
spotlight:
  errors:
    unknown: Неизвестная ошибка
    prefix: 'Что-то пошло не так: {message}'
    shortcutRegistrationFailed: 'Что-то пошло не так: не удалось зарегистрировать сочетание Spotlight.'
pages:
  modules:
    mcp-server:
      description: Возможность подключения и управления MCP сервером с инструментами
      title: MCP Сервер
  system:
    general:
      hide-app-icon:
        title: Скрыть значок на панели задач / в Dock
        description: Оставить Dahlia только в системном трее. Открывайте окна и выходите через меню трея. Изменения применяются сразу.
        load-error: Не удалось загрузить настройку значка приложения.
        save-error: Не удалось обновить настройку значка приложения.
    sections:
      section:
        window-shortcuts:
          title: Клавиши навигации окна
    window-shortcuts:
      description: Редактирование горячих клавиш для управления окном
      title: Горячие клавиши управления окном
      empty: Не задано
      spotlight:
        title: Сочетание Spotlight
        description: Нажмите сочетание, затем введите новое сочетание. Нажмите Esc для отмены.
      push-to-talk:
        title: Сочетание для разговора по нажатию
        description: Удерживайте это сочетание в любом приложении, пока говорите с Dahlia. Нажмите на сочетание и задайте новое. Нажмите Esc для отмены.
        inactive: Это сочетание работает только при режиме разговора по нажатию в настройках слуха и включённом микрофоне.
      actions:
        recording: Нажмите клавиши
        reset: Сбросить
      errors:
        load: Не удалось загрузить сочетание
        conflict: Это сочетание уже используется.
        failed: Не удалось обновить сочетание
        requiresModifier: Используйте хотя бы одну клавишу из Cmd, Ctrl, Alt или Super.
        requiresHoldModifier: Используйте Cmd, Ctrl, Alt, Super или функциональную клавишу, например F13. Одной Shift недостаточно.
        denied: Dahlia не может считывать глобальные нажатия клавиш. Разрешите Dahlia в настройках универсального доступа и повторите попытку.
        unsupported: Эта система не может определить отпускание глобального сочетания клавиш.
      toggle-move:
        label: Перемещение окна
      toggle-resize:
        label: Масштабирование окна
      toggle-ignore-mouse-event:
        label: Игнорировать курсор мыши
      press-keys: Нажмите любую клавишу...
    developer:
      sections:
        section:
          use-window-mouse:
            title: Инструмент useWindowMouse
            description: Тест положения курсора окна Electron
devtools:
  title: Разработчик
  pages:
    context-flow:
      title: Контекст потока
    presence-bubble:
      title: Пузырёк присутствия
      description: Управляйте пузырьком над персонажем и наблюдайте за ним в главном окне
      override:
        title: Управлять пузырьком отсюда
        description: Когда эта настройка выключена, сцена показывает пузырёк только во время хода чата.
      thinking:
        title: Размышление
        description: Показывает точки. Имеет приоритет над числом непрочитанных сообщений.
      unread:
        title: Непрочитанные сообщения
        description: Показывается как панель над головой со значком и числом.
      main-window-note: Изменения отображаются в главном окне Dahlia.
    editor:
      title: Редактор Dahlia
      description: Откройте окно редактора Dahlia
      button: Открыть редактор
    lag-visualizer:
      title: Лаг визуализатор
    performance-visualizer:
      title: Производительность визуализации
      description: Вкл/выкл FPS/долгую Задачу / оверлей памяти
      resource-events:
        title: Последние события ресурсов
        description: Последнее полученное событие отображается первым. Время — миллисекунды с запуска исходного процесса рендеринга.
        empty: События ресурсов не записаны. Загрузите или смените модель VRM при включённой трассировке.
        columns:
          time: Время (мс)
          phase: Фаза
          reason: Причина
          textures: Текстуры
          geometries: Геометрии
          meshes: Сетки
          materials: Материалы
      controls:
        enable-all:
          label: Включить все доступные метрики
          description: Включить каждую метрику, поддерживаемую этим браузером.
        start-recording: Начать запись
        stop-recording: Остановить запись ({seconds}с)
        export-last-recording: Экспортировать последнюю запись
      metrics:
        fps:
          description: Частота кадров анимации за последние 10 секунд. Каждый отсчёт равен 1000, делённым на интервал между кадрами в миллисекундах.
        frame-duration:
          label: Время кадра (мс)
          description: Время между кадрами анимации за последние 10 секунд.
        long-task:
          label: Долгие задачи
          description: Задачи главного потока длительностью не менее 50 мс.
          unsupported: Этот браузер не предоставляет время выполнения долгих задач.
        memory:
          label: Куча JS (МБ)
          description: Использование кучи JavaScript из API performance.memory Chromium.
          unsupported: Этот браузер не предоставляет использование кучи JavaScript.
      recording:
        title: Последняя запись
        duration: Длительность {duration} мс
        limit: Запись останавливается через 60 секунд.
      history:
        title: История FPS
        latest: Последнее
        minimum: Мин.
        maximum: Макс.
        seconds-ago: '-{seconds} с'
        end: 0 с
        empty: Нет отсчётов FPS. Включите FPS для сбора отсчётов.
      overlay:
        title: Производительность
        move: Переместить индикатор производительности
        reset-position: Сбросить положение индикатора
        record: Записать
        stop: Остановить
        export: Экспортировать последнюю запись
        average: сред.
    markdown-stress:
      title: Нагрузочное тестирование обработки Markdown
      description: Напряжение парсинг и рендеринга с тяжелыми чатами
    io-tracer:
      title: IO Трассировщик
      recording:
        title: Автоматически записывать трассировки ввода-вывода
        description: Сохраняет завершённые интервалы ввода-вывода в формате JSON Lines в папке данных приложения для анализа агентами программирования. Файлы старше семи дней удаляются.
    widgets-calling:
      title: Вызов виджета
screen-capture:
  permissions-prompt:
    title: Захват экрана
    description: Для захвата экранов или окон, требуется разрешение на запись с экрана и системы.
    open-preferences: Открыть «Системные настройки»
    dismiss: Отменить
    instructions:
      step-1: Откройте «Системные настройки», выберите «Конфиденциальность и безопасность» в боковой панели.
      step-2: В разделах "Запись экрана и системного звука" и "Только запись системного звука" включите переключатель для Dahlia.
      step-2-note: Если Dahlia отсутствует в списке, пожалуйста, добавьте его вручную, нажав кнопку "+" и выбрав Dahlia из папки "Приложения".
