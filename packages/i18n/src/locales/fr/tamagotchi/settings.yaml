allow-visible-on-all-workspaces:
  title: Visibilité sur tous les bureaux
  description: Permet à la fenêtre d’être visible sur tous les bureaux, macOS uniquement.
microphone-permission:
  prompt:
    title: Autoriser l’accès au microphone ?
    description: Dahlia utilise votre microphone pour la saisie vocale et la transcription. Ce choix reste actif jusqu’à sa réinitialisation dans les paramètres.
    allow: Autoriser
    deny: Refuser
  states:
    not-determined: Non défini
    granted: Autorisé
    denied: Refusé
  settings:
    description: Définissez si Dahlia peut utiliser le microphone. Réinitialiser ce choix arrête le flux actuel du microphone et redemande l’autorisation la prochaine fois.
    revoke: Révoquer l’accès
    reset: Réinitialiser le choix
spotlight:
  errors:
    unknown: Erreur inconnue
    prefix: 'Une erreur est survenue : {message}'
    shortcutRegistrationFailed: 'Une erreur est survenue : échec de l’enregistrement du raccourci Spotlight.'
pages:
  modules:
    mcp-server:
      description: Connecter et gérer le serveur MCP et ses outils
      title: Serveur MCP
  system:
    general:
      hide-app-icon:
        title: Masquer l’icône de la barre des tâches / du Dock
        description: Gardez Dahlia uniquement dans la zone de notification. Utilisez son menu pour ouvrir les fenêtres ou quitter. Les changements s’appliquent immédiatement.
        load-error: Impossible de charger le paramètre de l’icône de l’application.
        save-error: Impossible de mettre à jour le paramètre de l’icône de l’application.
    sections:
      section:
        window-shortcuts:
          title: Raccourcis clavier
    window-shortcuts:
      description: Modifier les raccourcis de la fenêtre.
      title: Raccourcis de la fenêtre
      empty: Non défini
      spotlight:
        title: Raccourci Spotlight
        description: Cliquez sur le raccourci, puis appuyez sur un nouveau raccourci. Appuyez sur Échap pour annuler.
      push-to-talk:
        title: Raccourci pour parler en maintenant une touche
        description: Maintenez ce raccourci dans toute application pour parler à Dahlia. Cliquez sur le raccourci puis appuyez sur une nouvelle combinaison. Appuyez sur Esc pour annuler.
        inactive: Ce raccourci fonctionne uniquement si le mode de saisie d’Audition est réglé sur parler en maintenant une touche et si le microphone est activé.
      actions:
        recording: Appuyez sur les touches
        reset: Réinitialiser
      errors:
        load: Échec du chargement du raccourci
        conflict: Ce raccourci est déjà utilisé.
        failed: Échec de la mise à jour du raccourci
        requiresModifier: Utilisez au moins Cmd, Ctrl, Alt ou Super.
        requiresHoldModifier: Utilisez Cmd, Ctrl, Alt ou Super, ou une touche de fonction comme F13. Shift seul ne suffit pas.
        denied: Dahlia ne peut pas lire les touches globales. Autorisez Dahlia dans les paramètres d’accessibilité, puis réessayez.
        unsupported: Ce système ne peut pas détecter le relâchement d’un raccourci global.
      toggle-move:
        label: (Dés)Activer - Déplacement
      toggle-resize:
        label: (Dés)Activer - Redimensionnement
      toggle-ignore-mouse-event:
        label: (Dés)Activer - Ignorer les événements de la souris
      press-keys: Appuyer sur les touches...
    developer:
      sections:
        section:
          use-window-mouse:
            title: Outil useWindowsMouse
            description: Tester la position du curseur dans la fenêtre Electron
devtools:
  title: Développeur
  pages:
    context-flow:
      title: Flux contextuel
    presence-bubble:
      title: Bulle de présence
      description: Pilotez la bulle au-dessus du personnage et observez-la dans la fenêtre principale
      override:
        title: Piloter la bulle depuis cette page
        description: Lorsque cette option est désactivée, la scène n’affiche la bulle que pendant un tour de chat.
      thinking:
        title: Raisonnement
        description: Affiche les points. Prioritaire sur le nombre de messages non lus.
      unread:
        title: Messages non lus
        description: Affiché au-dessus de la tête, avec un symbole et le nombre.
      main-window-note: Les changements apparaissent dans la fenêtre principale de Dahlia.
    editor:
      title: Éditeur Dahlia
      description: Ouvrir la fenêtre autonome de l’éditeur Dahlia
      button: Ouvrir l’éditeur
    lag-visualizer:
      title: Visualiseur de latence
    performance-visualizer:
      title: Visualiseur de performance
      description: Afficher l'overlay FPS / tâches longues / mémoire
      resource-events:
        title: Événements de ressources récents
        description: Le dernier événement reçu apparaît en premier. Le temps indique les millisecondes depuis le démarrage du processus de rendu source.
        empty: Aucun événement de ressource enregistré. Chargez ou changez un modèle VRM avec le traçage activé.
        columns:
          time: Temps (ms)
          reason: Raison
          geometries: Géométries
          meshes: Maillages
          materials: Matériaux
      controls:
        enable-all:
          label: Activer toutes les mesures disponibles
          description: Activez chaque mesure prise en charge par ce navigateur.
        start-recording: Démarrer l’enregistrement
        stop-recording: Arrêter l’enregistrement ({seconds}s)
        export-last-recording: Exporter le dernier enregistrement
      metrics:
        fps:
          description: Fréquence des images d’animation sur les 10 dernières secondes. Chaque échantillon vaut 1000 divisé par l’intervalle entre images en millisecondes.
        frame-duration:
          label: Durée d’image (ms)
          description: Temps entre les images d’animation sur les 10 dernières secondes.
        long-task:
          label: Tâches longues
          description: Tâches du fil principal qui durent au moins 50 ms.
          unsupported: Ce navigateur ne fournit pas la durée des tâches longues.
        memory:
          label: Tas JS (Mo)
          description: Utilisation du tas JavaScript fournie par l’API performance.memory de Chromium.
          unsupported: Ce navigateur ne fournit pas l’utilisation du tas JavaScript.
      recording:
        title: Dernier enregistrement
        duration: Durée {duration} ms
        limit: L’enregistrement s’arrête après 60 secondes.
      history:
        title: Historique des FPS
        latest: Dernier
        empty: Aucun échantillon FPS. Activez les FPS pour collecter des échantillons.
      overlay:
        title: Performances
        move: Déplacer l’indicateur de performances
        reset-position: Réinitialiser la position de l’indicateur
        record: Enregistrer
        stop: Arrêter
        export: Exporter le dernier enregistrement
        average: moy.
    markdown-stress:
      title: Test de charge Markdown
      description: Tester l'analyse et le rendu Markdown avec des charges de chat lourdes
    io-tracer:
      title: Traceur d’E/S
      recording:
        title: Enregistrer automatiquement les traces d’E/S
        description: Enregistrez les segments d’E/S terminés au format JSON Lines dans le dossier de données pour que les agents de programmation les analysent. Les fichiers de plus de sept jours sont supprimés.
    widgets-calling:
      title: Appel de widgets
screen-capture:
  permissions-prompt:
    title: Capture d'écran
    description: Pour capturer des écrans ou des fenêtres, les autorisations d’enregistrement de l'écran et de l'audio du système sont requises.
    open-preferences: Ouvrir les Préférences Système
    dismiss: Ignorer
    instructions:
      step-1: Ouvrir les "Préférences Système", sélectionnez "Confidentialité et Sécurité" dans la barre latérale.
      step-2: Dans les sections "Enregistrement de l’écran et des sons du système" et "Enregistrement des sons du système uniquement", activez les interrupteurs pour Dahlia.
      step-2-note: Si Dahlia n'est pas listé, veuillez l'ajouter manuellement en cliquant sur le bouton "+" et en sélectionnant Dahlia dans le dossier Applications.
