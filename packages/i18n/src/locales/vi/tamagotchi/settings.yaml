allow-visible-on-all-workspaces:
  title: Hiển thị ở mọi nơi
  description: Cho phép cửa sổ hiển thị trên tất cả workspaces, chỉ áp dụng cho macOS.
microphone-permission:
  prompt:
    title: Cho phép truy cập micrô?
    description: Dahlia dùng micrô để nhập giọng nói và phiên âm. Lựa chọn này có hiệu lực cho đến khi bạn đặt lại trong Cài đặt.
    allow: Cho phép
    deny: Từ chối
  states:
    not-determined: Chưa đặt
    granted: Đã cho phép
    denied: Đã từ chối
  settings:
    title: Micrô
    description: Kiểm soát việc Dahlia có thể dùng micrô hay không. Đặt lại lựa chọn này sẽ dừng luồng micrô hiện tại và hỏi lại vào lần sau.
    revoke: Thu hồi quyền truy cập
    reset: Đặt lại lựa chọn
spotlight:
  errors:
    unknown: Lỗi không xác định
    prefix: 'Đã xảy ra lỗi: {message}'
    shortcutRegistrationFailed: 'Đã xảy ra lỗi: không đăng ký được phím tắt Spotlight.'
pages:
  modules:
    mcp-server:
      description: Kết nối và quản lý máy chủ MCP và các công cụ
      title: Máy chủ MCP
  system:
    general:
      hide-app-icon:
        title: Ẩn biểu tượng trên thanh tác vụ / Dock
        description: Chỉ giữ Dahlia trong khay hệ thống. Dùng menu khay để mở cửa sổ hoặc thoát. Thay đổi có hiệu lực ngay.
        load-error: Không thể tải cài đặt biểu tượng ứng dụng.
        save-error: Không thể cập nhật cài đặt biểu tượng ứng dụng.
    sections:
      section:
        window-shortcuts:
          title: Phím tắt Windows
    window-shortcuts:
      description: Chỉnh sửa các phím tắt cho Windows.
      title: Phím tắt Windows
      empty: Chưa đặt
      spotlight:
        title: Phím tắt Spotlight
        description: Bấm vào phím tắt, rồi nhấn phím tắt mới. Nhấn Esc để hủy.
      push-to-talk:
        title: Phím tắt nhấn để nói
        description: Giữ phím tắt này trong bất kỳ ứng dụng nào khi nói với Dahlia. Nhấp vào phím tắt rồi nhấn tổ hợp mới. Nhấn Esc để hủy.
        inactive: Phím tắt này chỉ hoạt động khi chế độ nhập của Nghe là nhấn để nói và micrô đang bật.
      actions:
        recording: Nhấn phím
        reset: Đặt lại
      errors:
        load: Không tải được phím tắt
        conflict: Phím tắt này đã được sử dụng.
        failed: Không cập nhật được phím tắt
        requiresModifier: Dùng ít nhất một trong các phím Cmd, Ctrl, Alt hoặc Super.
        requiresHoldModifier: Dùng Cmd, Ctrl, Alt, Super hoặc phím chức năng như F13. Chỉ Shift là không đủ.
        denied: Dahlia không thể đọc phím toàn cục. Cho phép Dahlia trong cài đặt Trợ năng rồi thử lại.
        unsupported: Hệ thống này không thể phát hiện khi bạn thả phím tắt toàn cục.
      toggle-move:
        label: Bật/Tắt Di chuyển
      toggle-resize:
        label: Bật/Tắt Thay đổi kích thước
      toggle-ignore-mouse-event:
        label: Bật/Tắt Bỏ qua sự kiện chuột
      press-keys: Nhấn phím...
    developer:
      sections:
        section:
          use-window-mouse:
            title: Công cụ useWindowMouse
            description: Kiểm tra vị trí con trỏ chuột trong cửa sổ Electron
devtools:
  title: Nhà phát triển
  pages:
    context-flow:
      title: Luồng ngữ cảnh
    presence-bubble:
      title: Bong bóng hiện diện
      description: Điều khiển bong bóng phía trên nhân vật và xem trong cửa sổ chính
      override:
        title: Điều khiển bong bóng từ đây
        description: Khi tắt tùy chọn này, sân khấu chỉ hiện bong bóng khi đang xử lý một lượt trò chuyện.
      thinking:
        title: Suy nghĩ
        description: Hiện các dấu chấm. Ưu tiên hơn số tin nhắn chưa đọc.
      unread:
        title: Tin nhắn chưa đọc
        description: Hiện thành bảng phía trên đầu, có ký hiệu và số lượng.
      main-window-note: Thay đổi xuất hiện trong cửa sổ chính của Dahlia.
    editor:
      title: Trình chỉnh sửa Dahlia
      description: Mở cửa sổ Trình chỉnh sửa Dahlia độc lập
      button: Mở trình chỉnh sửa
    lag-visualizer:
      title: Trình trực quan hóa độ trễ
    performance-visualizer:
      title: Trình trực quan hóa hiệu năng
      description: Bật/Tắt lớp phủ hiển thị FPS/tác vụ dài/bộ nhớ
      resource-events:
        title: Sự kiện tài nguyên gần đây
        description: Sự kiện nhận mới nhất ở đầu. Thời gian tính bằng mili giây từ khi tiến trình kết xuất nguồn khởi động.
        empty: Chưa ghi sự kiện tài nguyên. Tải hoặc đổi mô hình VRM khi bật theo dõi.
        columns:
          time: Thời gian (ms)
          phase: Giai đoạn
          reason: Lý do
          textures: Kết cấu
          geometries: Hình học
          meshes: Lưới
          materials: Vật liệu
      controls:
        enable-all:
          label: Bật tất cả các chỉ số khả dụng
          description: Bật từng chỉ số mà trình duyệt này hỗ trợ.
        start-recording: Bắt đầu ghi
        stop-recording: Dừng ghi ({seconds} giây)
        export-last-recording: Xuất bản ghi gần nhất
      metrics:
        fps:
          description: Tốc độ khung hình hoạt ảnh trong 10 giây gần nhất. Mỗi mẫu bằng 1000 chia cho khoảng giữa các khung hình tính bằng mili giây.
        frame-duration:
          label: Thời gian khung hình (ms)
          description: Thời gian giữa các khung hình hoạt ảnh trong 10 giây qua.
        long-task:
          label: Tác vụ dài
          description: Các tác vụ luồng chính (main-thread) mất ít nhất 50 ms.
          unsupported: Trình duyệt này không hiển thị thời gian tác vụ dài.
        memory:
          label: Heap JS (MB)
          description: Dung lượng bộ nhớ JavaScript heap từ API performance.memory của Chromium.
          unsupported: Trình duyệt này không hiển thị dung lượng bộ nhớ JavaScript heap.
      recording:
        title: Bản ghi gần nhất
        duration: Thời lượng {duration} ms
        limit: Bản ghi sẽ dừng sau 60 giây.
      history:
        title: Lịch sử FPS
        latest: Mới nhất
        minimum: Tối thiểu
        maximum: Tối đa
        seconds-ago: '-{seconds} giây'
        end: 0 giây
        empty: Chưa có mẫu FPS. Bật FPS để thu thập mẫu.
      overlay:
        title: Hiệu năng
        move: Di chuyển lớp phủ hiệu năng
        reset-position: Đặt lại vị trí lớp phủ
        record: Ghi
        stop: Dừng
        export: Xuất bản ghi gần nhất
        average: trung bình
    markdown-stress:
      title: Kiểm thử áp lực Markdown
      description: Kiểm tra khả năng xử lý và hiển thị Markdown với dữ liệu hội thoại lớn
    io-tracer:
      title: Trình theo dõi I/O (IO Tracer)
      recording:
        title: Tự động ghi dấu vết I/O
        description: Lưu các khoảng I/O đã kết thúc dưới dạng JSON Lines trong thư mục dữ liệu ứng dụng để tác tử lập trình phân tích. Tệp cũ hơn bảy ngày sẽ bị xóa.
    widgets-calling:
      title: Gọi Widget
screen-capture:
  permissions-prompt:
    title: Chụp ảnh màn hình
    description: Để chụp màn hình hoặc cửa sổ, bạn cần cấp quyền ghi âm hệ thống và ghi màn hình.
    open-preferences: Mở Tùy chọn hệ thống
    dismiss: Bỏ qua
    instructions:
      step-1: Mở "Tùy chọn hệ thống", chọn "Quyền riêng tư & Bảo mật" từ thanh bên.
      step-2: Trong phần "Bản ghi âm thanh hệ thống & màn hình" và "Chỉ bản ghi âm thanh hệ thống", hãy bật công tắc cho Dahlia.
      step-2-note: Nếu không thấy Dahlia trong danh sách, vui lòng thêm thủ công bằng cách nhấn nút "+" và chọn Dahlia từ thư mục Ứng dụng (Applications).
