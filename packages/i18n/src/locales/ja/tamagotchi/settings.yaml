allow-visible-on-all-workspaces:
  title: すべてのワークスペースで表示
  description: ウィンドウをすべてのワークスペースで表示可能にします。macOSのみ。
microphone-permission:
  prompt:
    title: マイクへのアクセスを許可しますか？
    description: Dahliaは音声入力と文字起こしにマイクを使います。この選択は設定でリセットするまで有効です。
    allow: 許可
    deny: 拒否
  states:
    not-determined: 未設定
    granted: 許可済み
    denied: 拒否済み
  settings:
    title: マイク
    description: Dahliaによるマイクの使用を管理します。この選択をリセットすると、現在のマイク入力が停止し、次回再び許可を求めます。
    revoke: アクセスを取り消す
    reset: 選択をリセット
spotlight:
  errors:
    unknown: 不明なエラー
    prefix: '問題が発生しました: {message}'
    shortcutRegistrationFailed: '問題が発生しました: Spotlight ショートカットを登録できませんでした。'
pages:
  modules:
    mcp-server:
      description: MCPサーバーとツールの接続と管理
      title: MCPサーバー
  system:
    general:
      hide-app-icon:
        title: タスクバー／Dockのアイコンを非表示
        description: Dahliaをトレイにのみ表示します。ウィンドウの表示や終了にはトレイメニューを使ってください。変更はすぐに適用されます。
        load-error: アプリアイコンの設定を読み込めませんでした。
        save-error: アプリアイコンの設定を更新できませんでした。
    sections:
      section:
        window-shortcuts:
          title: キーボードショートカット
    window-shortcuts:
      description: ウィンドウ用ショートカットを変更します。
      title: ウィンドウショートカット
      empty: 未設定
      spotlight:
        title: Spotlight ショートカット
        description: ショートカットをクリックしてから新しいショートカットを押します。Esc でキャンセルします。
      push-to-talk:
        title: プッシュトゥトークのショートカット
        description: どのアプリでも、このショートカットを押しながらDahliaに話しかけられます。ショートカットをクリックして新しいキーの組み合わせを押してください。Escでキャンセルできます。
        inactive: このショートカットは、聴覚の入力モードがプッシュトゥトークで、マイクがオンの場合のみ使えます。
      actions:
        recording: キーを押してください
        reset: リセット
      errors:
        load: ショートカットを読み込めませんでした
        conflict: このショートカットは使用中です。
        failed: ショートカットの更新に失敗しました
        requiresModifier: Cmd、Ctrl、Alt、Super のいずれかを少なくとも 1 つ使用してください。
        requiresHoldModifier: Cmd、Ctrl、Alt、Superのいずれか、またはF13などのファンクションキーを使用してください。Shiftだけでは使えません。
        denied: Dahliaがグローバルキーを読み取れません。アクセシビリティ設定でDahliaを許可してから再試行してください。
        unsupported: このシステムはグローバルショートカットのキーを離したことを検出できません。
      toggle-move:
        label: 移動の切り替え
      toggle-resize:
        label: サイズ変更の切り替え
      toggle-ignore-mouse-event:
        label: マウスイベント無視の切り替え
      press-keys: 何かキーを押してください…
    developer:
      sections:
        section:
          use-window-mouse:
            title: ウィンドウマウス ツールを使用
            description: Electronウィンドウのカーソル位置をテストします
devtools:
  title: 開発者
  pages:
    context-flow:
      title: コンテキストのフロー
    presence-bubble:
      title: プレゼンスバブル
      description: キャラクターの頭上のバブルを操作し、メインウィンドウで確認します
      override:
        title: ここからバブルを操作
        description: オフの場合、チャットのターン実行中以外はステージにバブルを表示しません。
      thinking:
        title: 思考 (Thinking)
        description: ドットを表示します。未読件数より優先されます。
      unread:
        title: 未読メッセージ
        description: 頭上のパネルにマークと件数を表示します。
      main-window-note: 変更はDahliaのメインウィンドウに反映されます。
    editor:
      title: Dahliaエディタ
      description: Dahliaエディタウィンドウを開く
      button: エディタを開く
    lag-visualizer:
      title: ラグビジュアライザー
    performance-visualizer:
      title: パフォーマンスビジュアライザー
      description: FPS/ロングタスク/メモリーオーバーレイの切り替え
      resource-events:
        title: 最近のリソースイベント
        description: 受信した最新のイベントを先頭に表示します。時刻は送信元レンダラーの起動からのミリ秒です。
        empty: リソースイベントは記録されていません。トレースを有効にしてVRMモデルを読み込むか切り替えてください。
        columns:
          time: 時刻（ミリ秒）
          phase: フェーズ
          reason: 理由
          textures: テクスチャ
          geometries: ジオメトリ
          meshes: メッシュ
          materials: マテリアル
      controls:
        enable-all:
          label: 利用可能なすべてのメトリックを有効にする
          description: このブラウザがサポートする各メトリックを有効にします。
        start-recording: 記録開始
        stop-recording: 記録停止 ({seconds}s)
        export-last-recording: 最後の録音をエクスポート
      metrics:
        fps:
          description: 直近10秒間のアニメーションフレームレートです。各サンプルは1000をフレーム間隔のミリ秒数で割った値です。
        frame-duration:
          label: フレーム時間 (ミリ秒)
          description: 直近10秒間のアニメーションフレーム間隔。
        long-task:
          label: ロングタスク
          description: 少なくとも50ミリ秒を要するメインスレッドのタスク。
          unsupported: このブラウザーは長時間のタスクタイミングを表示しません。
        memory:
          label: JS ヒープ（MB）
          description: Chromiumのperformance.memory APIからのJavaScriptのヒープ使用量。
          unsupported: このブラウザはJavaScriptヒープの使用状況を公開しません。
      recording:
        title: 前回の録音
        duration: 期間 {duration} ms
        limit: 録音は60秒後に停止します。
      history:
        title: FPS履歴
        latest: 最新
        minimum: 最小
        maximum: 最大
        seconds-ago: '-{seconds}秒'
        end: 0秒
        empty: FPSサンプルがありません。FPSを有効にしてサンプルを収集してください。
      overlay:
        title: 生産力
        move: パフォーマンスオーバーレイを移動
        reset-position: オーバーレイ位置をリセット
        record: ゲスト記録
        stop: 停止
        export: 最後の録音をエクスポート
        average: 平均
    markdown-stress:
      title: Markdown ストレス
      description: 大量のチャットデータを含むMarkdownの解析とレンダリング負荷のテスト
    io-tracer:
      title: 入出力トレーサー
      recording:
        title: 入出力トレースを自動記録
        description: 完了した入出力スパンをアプリのデータフォルダーにJSON Lines形式で保存し、コーディングエージェントが分析できるようにします。7日を過ぎたファイルは削除されます。
    widgets-calling:
      title: ウィジェット呼び出し
screen-capture:
  permissions-prompt:
    title: 画面キャプチャ
    description: 画面またはウィンドウをキャプチャするには、画面とシステムのオーディオ録音の許可が必要です。
    open-preferences: システム設定を開く
    dismiss: 閉じる
    instructions:
      step-1: '「システム設定」を開き、サイドバーから「プライバシーとセキュリティ」を選択します。'
      step-2: '「画面収録とシステムオーディオ録音」および「システムオーディオ録音のみ」のセクションで、Dahlia用のスイッチをオンにしてください。'
      step-2-note: Dahliaが表示されていない場合は、「+」ボタンをクリックして「アプリケーション」フォルダから「Dahlia」を選択して手動で追加してください。
