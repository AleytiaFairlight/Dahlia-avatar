devtools:
  title: 开发者选项
  pages:
    context-flow:
      title: 上下文流
    presence-bubble:
      title: 状态气泡
      description: 从这里驱动角色头顶的气泡，效果显示在主窗口
      override:
        title: 由此处驱动气泡
        description: 关闭时，除非有对话回合正在进行，舞台不显示气泡。
      thinking:
        title: 思考中
        description: 显示三个点。优先级高于未读数量。
      unread:
        title: 未读消息
        description: 在头部旁以气泡显示，内含提示标记和数量。
      main-window-note: 改动会即时反映在 Dahlia 主窗口。
    editor:
      title: Dahlia 编辑器
      description: 打开独立的 Dahlia 编辑器窗口
      button: 打开编辑器
    lag-visualizer:
      title: Lag 可视化
    performance-visualizer:
      title: 性能可视化
      description: 检查实时性能指标和运行时诊断数据
      resource-events:
        title: 最近的资源事件
        description: 按接收顺序倒序显示。时间为来源渲染进程启动后的毫秒数。
        empty: 暂无资源事件。请在启用追踪时加载或切换 VRM 模型。
        columns:
          time: 时间（毫秒）
          phase: 阶段
          reason: 原因
          textures: 纹理
          geometries: 几何体
          meshes: 网格
          materials: 材质
      controls:
        enable-all:
          label: 启用所有可用指标
          description: 启用当前浏览器支持的所有指标。
        start-recording: 开始录制
        stop-recording: 停止录制（{seconds} 秒）
        export-last-recording: 导出上次录制
      metrics:
        fps:
          description: 最近 10 秒内的动画帧率。每个样本为 1000 除以帧间隔（毫秒）。
        frame-duration:
          label: 帧时间（毫秒）
          description: 最近 10 秒内动画帧之间的时间。
        long-task:
          label: 长任务
          description: 耗时至少 50 毫秒的主线程任务。
          unsupported: 当前浏览器不提供长任务计时。
        memory:
          label: JS 堆（MB）
          description: Chromium performance.memory API 提供的 JavaScript 堆用量。
          unsupported: 当前浏览器不提供 JavaScript 堆用量。
      recording:
        title: 上次录制
        duration: 时长 {duration} 毫秒
        limit: 录制会在 60 秒后停止。
      history:
        title: FPS 历史
        latest: 最新
        minimum: 最低
        maximum: 最高
        seconds-ago: '-{seconds} 秒'
        end: 0 秒
        empty: 暂无 FPS 样本，请启用 FPS 采集。
      overlay:
        title: 性能
        move: 移动性能浮窗
        reset-position: 重置浮窗位置
        record: 录制
        stop: 停止
        export: 导出上次录制
        average: 平均
    markdown-stress:
      title: Markdown 压力测试
      description: 用大量聊天负载来测试 Markdown 的解析和渲染能力
    io-tracer:
      title: IO 追踪
      description: 把语音、对话和 Agent 的活动画在同一条时间轴上。
      actions:
        back: 返回
        record: 录制
        pause: 暂停
        start-from-now: 从现在开始
        start-from-now-description: 清空已有记录，从现在开始跟随。
        export: 导出 JSONL
        fit: 适应窗口
        show: 显示 {name}
        hide: 隐藏 {name}
        clear-cursor: 清除游标
      toggles:
        follow: 跟随
      panels:
        timeline: 时间轴
        pipeline: 流水线
        log: 事件日志
        detail: 详情
        metrics: 指标
      view:
        label: 视图
        all: 全部 track
      detail:
        empty: 在时间轴上选择一个 span、事件或状态。
      status:
        paused: 已暂停
        duration: 时长
        running: 运行中
        idle: 空闲
        records: '{count} 条记录'
        late: '{count} 条迟到'
        reordered: '{count} 条乱序'
        reordered-description: 时钟换算后排到了起因之前的记录数。
      collection:
        title: 在内存中保留最近的 IO Trace
        description: 保留最近 30 分钟、最多 16 MB 的追踪记录，打开 IO 追踪时也能看到之前发生的事件。
      recording:
        title: 自动记录 IO Trace
        description: 把追踪记录以 JSON Lines 保存在应用数据目录，供 Agent 分析。七天前的文件会被自动删除。
    widgets-calling:
      title: 小组件调用
screen-capture:
  permissions-prompt:
    title: 屏幕捕获
    description: 要捕获屏幕或窗口，需要屏幕和系统音频录制权限。
    open-preferences: 打开系统偏好设置
    dismiss: 取消
    instructions:
      step-1: 打开「系统首选项」，从侧边栏选择「隐私与安全」。
      step-2: 在「录屏与系统录音」和「仅系统录音」部分中，开启 Dahlia 的开关。
      step-2-note: 如果没有列出 Dahlia，请通过单击「+」按钮和从应用程序文件夹中选择 Dahlia 来手动添加。
