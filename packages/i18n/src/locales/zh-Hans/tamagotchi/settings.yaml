        title: Spotlight 快捷键
        description: 点击快捷键后按下新的快捷键，按 Esc 取消。
      push-to-talk:
        title: 按住说话快捷键
        description: 在任意应用中按住此快捷键对 Dahlia 说话。点击快捷键后按下新的快捷键，按 Esc 取消。
        inactive: 仅当听觉输入模式为「按住说话」且麦克风已开启时，此快捷键才会生效。
