devtools:
  title: Developer
  pages:
    context-flow:
      title: Context Flow
    presence-bubble:
      title: Presence Bubble
      description: Drive the bubble above the character and watch it in the main window
      override:
        title: Drive the bubble from here
        description: While this is off the stage shows no bubble unless a chat turn is running.
      thinking:
        title: Thinking
        description: Shows the dots. Takes precedence over the unread count.
      unread:
        title: Unread messages
        description: Shown as a panel on the head, with a mark and the count.
      main-window-note: Changes appear in the main Dahlia window.
    editor:
      title: Dahlia Editor
      description: Open the standalone Dahlia Editor window
      button: Open Editor
    lag-visualizer:
      title: Lag Visualizer
    performance-visualizer:
      title: Performance Visualizer
      description: Inspect live performance metrics and runtime diagnostics
      resource-events:
        title: Recent resource events
        description: Newest received event first. Time is milliseconds since the source renderer started.
        empty: No resource events recorded. Load or switch a VRM model while tracing is enabled.
        columns:
          time: Time (ms)
          phase: Phase
          reason: Reason
          textures: Textures
          geometries: Geometries
          meshes: Meshes
          materials: Materials
      controls:
        enable-all:
          label: Enable all available metrics
          description: Enable each metric that this browser supports.
        start-recording: Start recording
        stop-recording: Stop recording ({seconds}s)
        export-last-recording: Export last recording
      metrics:
        fps:
          label: FPS
          description: Animation frame rate during the last 10 seconds. Each sample is 1000 divided by the frame interval in milliseconds.
        frame-duration:
          label: Frame time (ms)
          description: Time between animation frames during the last 10 seconds.
        long-task:
          label: Long tasks
          description: Main-thread tasks that take at least 50 ms.
          unsupported: This browser does not expose long-task timing.
        memory:
          label: JS heap (MB)
          description: JavaScript heap usage from Chromium's performance.memory API.
          unsupported: This browser does not expose JavaScript heap usage.
      recording:
        title: Last recording
        duration: Duration {duration} ms
        limit: Recording stops after 60 seconds.
      history:
        title: FPS history
        latest: Latest
        minimum: Min
        maximum: Max
        seconds-ago: '-{seconds} s'
        end: 0 s
        empty: No FPS samples. Enable FPS to collect samples.
      overlay:
        title: Performance
        move: Move performance overlay
        reset-position: Reset overlay position
        record: Record
        stop: Stop
        export: Export last recording
        average: avg
    markdown-stress:
      title: Markdown Stress
      description: Stress markdown parsing and rendering with heavy chat payloads
    io-tracer:
      title: IO Tracer
      description: Records what voice, chat, and agents do, as lanes on one clock.
      actions:
        back: Back
        record: Record
        pause: Pause
        start-from-now: Start from now
        start-from-now-description: Clears the records so far and follows from now.
        export: Export JSONL
        fit: Fit
        show: Show {name}
        hide: Hide {name}
        clear-cursor: Clear cursor
      toggles:
        follow: Follow
      panels:
        timeline: Timeline
        pipeline: Pipeline
        log: Event log
        detail: Detail
        metrics: Metrics
      view:
        label: View
        all: All tracks
      detail:
        empty: Select a span, an event, or a state on the timeline.
      status:
        paused: Paused
        duration: Duration
        running: Running
        idle: Idle
        records: '{count} records'
        tokens: '{count} tokens'
        late: '{count} late'
        reordered: '{count} reordered'
        reordered-description: Times that clock conversion put a record before its cause.
      collection:
        title: Keep recent IO traces in memory
        description: Keep the trace records of the last 30 minutes, up to 16 MB, so the IO Tracer can show what happened before it opened.
      recording:
        title: Record IO traces automatically
        description: Save trace records as JSON Lines in the app data folder so coding agents can analyze them. Files older than seven days are removed.
    widgets-calling:
      title: Widget Calling

screen-capture:
  permissions-prompt:
    title: Screen Capture
    description: To capture screens or windows, screen and system audio recording permissions are required.
    open-preferences: Open System Preferences
    dismiss: Dismiss
    instructions:
      step-1: Open "System Preferences", select "Privacy & Security" from the sidebar.
      step-2: In the "Screen & System Audio Recording" and "System Audio Recording Only" sections, turn on the switches for Dahlia.
      step-2-note: If Dahlia is not listed, please add it manually by clicking the "+" button and selecting Dahlia from the Applications folder.
