allow-visible-on-all-workspaces:
  title: 모든 작업 공간에 표시
  description: 모든 작업 공간에 창을 볼 수 있도록 합니다. macOS 전용 기능입니다.
microphone-permission:
  prompt:
    title: 마이크 접근을 허용할까요?
    description: Dahlia는 음성 입력과 음성 인식에 마이크를 사용합니다. 설정에서 초기화할 때까지 이 선택이 유지됩니다.
    allow: 허용
    deny: 거부
  states:
    not-determined: 설정되지 않음
    granted: 허용됨
    denied: 거부됨
  settings:
    title: 마이크
    description: Dahlia의 마이크 사용을 제어합니다. 이 선택을 초기화하면 현재 마이크 스트림을 중지하고 다음에 다시 권한을 요청합니다.
    revoke: 접근 권한 취소
    reset: 선택 초기화
spotlight:
  errors:
    unknown: 알 수 없는 오류
    prefix: '문제가 발생했습니다: {message}'
    shortcutRegistrationFailed: '문제가 발생했습니다: Spotlight 단축키를 등록하지 못했습니다.'
pages:
  modules:
    mcp-server:
      description: MCP 서버 및 도구 연결 및 관리
      title: MCP 서버
  system:
    general:
      hide-app-icon:
        title: 작업 표시줄 / Dock 아이콘 숨기기
        description: Dahlia를 트레이에만 표시합니다. 트레이 메뉴에서 창을 열거나 종료하세요. 변경 사항은 즉시 적용됩니다.
        load-error: 앱 아이콘 설정을 불러올 수 없습니다.
        save-error: 앱 아이콘 설정을 업데이트할 수 없습니다.
    sections:
      section:
        window-shortcuts:
          title: 키보드 단축키
    window-shortcuts:
      description: 창 바로 가기를 수정합니다.
      title: 창 바로 가기
      empty: 설정되지 않음
      spotlight:
        title: Spotlight 단축키
        description: 단축키를 클릭한 다음 새 단축키를 누르세요. Esc를 누르면 취소됩니다.
      push-to-talk:
        title: 눌러서 말하기 단축키
        description: 어느 앱에서든 이 단축키를 누른 채 Dahlia에게 말하세요. 단축키를 클릭한 다음 새 단축키를 누르세요. Esc를 누르면 취소됩니다.
        inactive: 청각 입력 모드가 눌러서 말하기이고 마이크가 켜져 있을 때만 이 단축키가 작동합니다.
      actions:
        recording: 키를 누르세요
        reset: 재설정
      errors:
        load: 단축키를 불러오지 못했습니다
        conflict: 이 단축키는 이미 사용 중입니다.
        failed: 단축키 업데이트 실패
        requiresModifier: Cmd, Ctrl, Alt 또는 Super 중 하나 이상을 사용하세요.
        requiresHoldModifier: Cmd, Ctrl, Alt, Super 또는 F13 같은 기능 키를 사용하세요. Shift만으로는 부족합니다.
        denied: Dahlia가 전역 키 입력을 읽을 수 없습니다. 손쉬운 사용 설정에서 Dahlia를 허용한 다음 다시 시도하세요.
        unsupported: 이 시스템은 전역 단축키를 놓는 시점을 감지할 수 없습니다.
      toggle-move:
        label: 이동 켜기/끄기
      toggle-resize:
        label: 크기 조정 켜기/끄기
      toggle-ignore-mouse-event:
        label: 마우스 이벤트 무시 켜기/끄기
      press-keys: 키를 누르세요...
    developer:
      sections:
        section:
          use-window-mouse:
            title: useWindowMouse 도구
            description: Electron 창 커서 위치 테스트
devtools:
  title: 개발자 옵션
  pages:
    context-flow:
      title: 컨텍스트 흐름
    presence-bubble:
      title: 상태 말풍선
      description: 캐릭터 위의 말풍선을 제어하고 메인 창에서 확인하세요
      override:
        title: 여기서 말풍선 제어
        description: 이 기능이 꺼져 있으면 채팅 턴이 진행 중일 때만 무대에 말풍선이 표시됩니다.
      thinking:
        title: 추론
        description: 점을 표시합니다. 읽지 않은 메시지 수보다 우선합니다.
      unread:
        title: 읽지 않은 메시지
        description: 머리 위 패널에 표시와 개수가 나타납니다.
      main-window-note: 변경 사항은 Dahlia 메인 창에 표시됩니다.
    editor:
      title: Dahlia 편집기
      description: 독립 Dahlia 편집기 창 열기
      button: 편집기 열기
    lag-visualizer:
      title: 로그 비주얼라이저
    performance-visualizer:
      title: 성능 비주얼라이저
      description: FPS/긴 작업/메모리 오버레이 전환
      resource-events:
        title: 최근 리소스 이벤트
        description: 가장 최근에 받은 이벤트부터 표시합니다. 시간은 원본 렌더러가 시작된 후 경과한 밀리초입니다.
        empty: 기록된 리소스 이벤트가 없습니다. 추적이 활성화된 상태에서 VRM 모델을 불러오거나 전환하세요.
        columns:
          time: 시간 (ms)
          phase: 단계
          reason: 이유
          textures: 텍스처
          geometries: 지오메트리
          meshes: 메시
          materials: 재질
      controls:
        enable-all:
          label: 사용 가능한 모든 지표 켜기
          description: 이 브라우저가 지원하는 모든 지표를 켭니다.
        start-recording: 기록 시작
        stop-recording: 기록 중지 ({seconds}초)
        export-last-recording: 최근 기록 내보내기
      metrics:
        fps:
          description: 지난 10초 동안의 애니메이션 프레임 속도입니다. 각 샘플은 1000을 밀리초 단위의 프레임 간격으로 나눈 값입니다.
        frame-duration:
          label: 프레임 시간 (ms)
          description: 지난 10초 동안의 애니메이션 프레임 간 시간입니다.
        long-task:
          label: 긴 작업
          description: 최소 50 ms가 걸리는 메인 스레드 작업입니다.
          unsupported: 이 브라우저는 긴 작업의 시간 정보를 제공하지 않습니다.
        memory:
          label: JS 힙 (MB)
          description: Chromium의 performance.memory API에서 가져온 JavaScript 힙 사용량입니다.
          unsupported: 이 브라우저는 JavaScript 힙 사용량을 제공하지 않습니다.
      recording:
        title: 최근 기록
        duration: 기록 시간 {duration} ms
        limit: 기록은 60초 후에 중지됩니다.
      history:
        title: FPS 기록
        latest: 최신
        minimum: 최소
        maximum: 최대
        seconds-ago: '-{seconds}초'
        end: 0초
        empty: FPS 샘플이 없습니다. FPS를 켜서 샘플을 수집하세요.
      overlay:
        title: 성능
        move: 성능 오버레이 이동
        reset-position: 오버레이 위치 초기화
        record: 기록
        stop: 중지
        export: 최근 기록 내보내기
        average: 평균
    markdown-stress:
      title: 마크다운 스트레스
      description: 스트레스 마크다운 구문 분석 및 대량 채팅 페이로드 렌더링
    io-tracer:
      title: 입출력 추적기
      collection:
        title: 최근 입출력 추적을 메모리에 보관
        description: 입출력 추적기가 열리기 전의 상황도 보여 줄 수 있도록, 최근 30분 동안의 입출력 스팬을 최대 5000개까지 보관합니다.
      recording:
        title: 입출력 추적 자동 기록
        description: 완료된 입출력 스팬을 앱 데이터 폴더에 JSON Lines로 저장하여 코딩 에이전트가 분석할 수 있게 합니다. 7일이 지난 파일은 삭제됩니다.
    widgets-calling:
      title: 위젯 호출
screen-capture:
  permissions-prompt:
    title: 화면 캡쳐
    description: 화면이나 창을 캡쳐하기 위해선 화면 및 시스템 오디오 녹음 권한이 필요합니다.
    open-preferences: 시스템 환경설정 열기
    dismiss: 무시
    instructions:
      step-1: '"시스템 환경설정"을 열고 사이드 바에서 "프라이버시 및 보안"을 선택합니다.'
      step-2: '"화면 및 시스템 오디오 녹음" 및 "시스템 오디오 녹음만" 섹션에서 Dahlia에 대한 스위치를 켭니다.'
      step-2-note: Dahlia가 목록에 없는 경우, "+" 버튼을 클릭하고 애플리케이션 폴더에서 Dahlia를 선택하여 수동으로 추가해 주세요.
